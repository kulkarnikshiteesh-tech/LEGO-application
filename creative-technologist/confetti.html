<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#F5F1E8; overflow:hidden;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #topbar {
    position:fixed; top:20px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 24px; z-index:10;
  }
  button {
    font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    background:#16181C; color:#F5F1E8; border:none;
    padding:10px 16px; border-radius:6px; cursor:pointer;
  }
  button.connected { background:#2E7D32; }

  #headline {
    font-size:clamp(28px, 5vw, 52px);
    font-weight:600; letter-spacing:-0.01em;
    color:#16181C;
    text-align:center;
    opacity:0;
    transform:scale(0.9);
    transition:opacity .3s ease, transform .3s ease;
  }
  #headline.visible { opacity:1; transform:scale(1); }

  canvas#confetti {
    position:fixed; inset:0; pointer-events:none;
  }
</style>
</head>
<body>

  <div id="topbar">
    <button id="connect">Connect</button>
    <button id="test">Simulate</button>
  </div>

  <div id="headline">I am passionate about play.</div>
  <canvas id="confetti"></canvas>

<script src="./serial-hub.js"></script>
<script>
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const headline = document.getElementById('headline');
  const connectBtn = document.getElementById('connect');
  const testBtn = document.getElementById('test');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#E85D14', '#0057A6', '#237841', '#F2CD37', '#D01012'];
  let particles = [];

  function burst() {
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 1.3) * 14,
        size: 5 + Math.random() * 5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 12,
        life: 0,
      });
    }
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.life < 140);
    for (const p of particles) {
      p.vy += 0.28;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life / 140);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();

  function trigger() {
    burst();
    headline.classList.add('visible');
    setTimeout(() => headline.classList.remove('visible'), 2600);
  }

  window.addEventListener('serial-msg', (e) => {
    if (e.detail === 'BUZZ') trigger();
  });

  window.addEventListener('serial-status', (e) => {
    if (e.detail === 'connected') {
      connectBtn.textContent = 'Connected';
      connectBtn.classList.add('connected');
    } else if (e.detail === 'disconnected' || e.detail === 'error') {
      connectBtn.textContent = 'Connect';
      connectBtn.classList.remove('connected');
    }
  });

  connectBtn.addEventListener('click', async () => {
    try { await SerialHub.connect(); }
    catch (err) { alert(err.message); }
  });

  testBtn.addEventListener('click', trigger);
</script>
</body>
</html>
