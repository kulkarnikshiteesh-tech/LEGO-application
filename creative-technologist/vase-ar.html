<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vase AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#16181C; overflow:hidden;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #cam {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* rear camera: no mirror -- what you see is what's actually there */
  }
  #three-canvas {
    position:fixed; inset:0; width:100%; height:100%;
  }
  #debug-dots {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:15; pointer-events:none;
  }

  /* ---- pre-start gate, matches the joystick pop-out pattern ---- */
  #gate {
    position:fixed; inset:0; z-index:20;
    background:#16181C;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    transition:opacity .4s ease;
  }
  #gate.hidden { opacity:0; pointer-events:none; }
  #gate-btn {
    width:110px; height:110px; border-radius:50%;
    background:#E85D14; border:none;
    display:flex; align-items:center; justify-content:center;
  }
  #gate-btn svg { width:40px; height:40px; fill:#16181C; }
  #gate p {
    color:#8A8D94; font-size:14px; max-width:280px; text-align:center; line-height:1.5;
  }
  #gate.loading #gate-btn { opacity:0.5; }

  #chrome { position:fixed; inset:0; z-index:10; pointer-events:none; }
  #status {
    position:fixed; bottom:16px; left:16px;
    color:#F5F1E8; font-size:11px; opacity:0.55;
  }
  #reset {
    position:fixed; top:16px; right:16px;
    width:36px; height:36px; border-radius:8px;
    background:rgba(22,24,28,0.55); border:none;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
  }
  #reset svg { width:18px; height:18px; stroke:#F5F1E8; }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="debug-dots"></canvas>

  <div id="chrome">
    <div id="status">--</div>
    <button id="reset" title="Reset (for retakes)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </div>

  <div id="gate">
    <button id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p>Rear camera + hand tracking. Tap once, then it's hands-free: a dashed box marks the disc position -- bring your hand into it to start, then move it up to shape the vase.</p>
  </div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  const camEl = document.getElementById('cam');
  const canvasEl = document.getElementById('three-canvas');
  const debugCanvas = document.getElementById('debug-dots');
  const debugCtx = debugCanvas.getContext('2d');
  const gate = document.getElementById('gate');
  const gateBtn = document.getElementById('gate-btn');
  const gateText = gate.querySelector('p');
  const resetBtn = document.getElementById('reset');
  const status = document.getElementById('status');

  // ---- three.js scene, orthographic camera mapped 1:1 to screen pixels
  // (same pattern as the joystick pop-out) so the lathe sits exactly
  // where your fingertip is. ----
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
  const scene = new THREE.Scene();
  let camera;

  function makeCamera() {
    const w = window.innerWidth, h = window.innerHeight;
    camera = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 2000);
    camera.position.z = 500;
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    makeCamera();
    debugCanvas.width = window.innerWidth;
    debugCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const keyLight = new THREE.DirectionalLight(0xfff4e6, 1.1);
  keyLight.position.set(1, 1, 1.5);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
  fillLight.position.set(-1, -0.4, 1);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xe85d14, 0.4);
  rimLight.position.set(-1, 0.6, -1);
  scene.add(rimLight);

  const vaseGroup = new THREE.Group();
  scene.add(vaseGroup);
  let vaseMesh = null;
  const CLAY_COLOR = 0xC7A97C; // warm stoneware tan, not terracotta

  function screenToWorld(x, y) {
    return { x: x - window.innerWidth / 2, y: -(y - window.innerHeight / 2) };
  }

  // ---- finishing sparkle burst: fires once when your hand leaves frame
  // after a vase exists. Simple particle system, self-disposing. ----
  const SPARKLE_COUNT = 60;
  const SPARKLE_LIFETIME = 1.6; // seconds
  let sparklePoints = null, sparkleVelocities = null, sparkleAge = 0, sparkleActive = false;

  function triggerSparkles() {
    if (!vaseMesh) return;
    const box = new THREE.Box3().setFromObject(vaseMesh);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const size = new THREE.Vector3();
    box.getSize(size);
    const radius = Math.max(size.x, size.z) / 2 || 40;
    const height = size.y || 100;

    const positions = new Float32Array(SPARKLE_COUNT * 3);
    sparkleVelocities = new Float32Array(SPARKLE_COUNT * 3);
    for (let i = 0; i < SPARKLE_COUNT; i++) {
      // start scattered around the vase's silhouette, not all from one point
      const angle = Math.random() * Math.PI * 2;
      const r = radius * (0.7 + Math.random() * 0.6);
      const y = center.y + (Math.random() - 0.3) * height;
      positions[i * 3] = vaseGroup.position.x + Math.cos(angle) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(angle) * r;

      sparkleVelocities[i * 3] = Math.cos(angle) * (20 + Math.random() * 30);
      sparkleVelocities[i * 3 + 1] = 40 + Math.random() * 60;
      sparkleVelocities[i * 3 + 2] = Math.sin(angle) * (20 + Math.random() * 30);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
      color: 0xF2CD37,
      size: 10,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    sparklePoints = new THREE.Points(geometry, material);
    scene.add(sparklePoints);
    sparkleAge = 0;
    sparkleActive = true;
  }

  function tickSparkles(dt) {
    if (!sparkleActive) return;
    sparkleAge += dt;
    const t = sparkleAge / SPARKLE_LIFETIME;
    if (t >= 1) {
      scene.remove(sparklePoints);
      sparklePoints.geometry.dispose();
      sparklePoints.material.dispose();
      sparklePoints = null;
      sparkleActive = false;
      return;
    }
    const pos = sparklePoints.geometry.attributes.position.array;
    for (let i = 0; i < SPARKLE_COUNT; i++) {
      pos[i * 3] += sparkleVelocities[i * 3] * dt;
      pos[i * 3 + 1] += sparkleVelocities[i * 3 + 1] * dt;
      sparkleVelocities[i * 3 + 1] -= 60 * dt; // gentle gravity, arcs back down
      pos[i * 3 + 2] += sparkleVelocities[i * 3 + 2] * dt;
    }
    sparklePoints.geometry.attributes.position.needsUpdate = true;
    sparklePoints.material.opacity = 1 - t;
  }

  let lastRenderAt = null;
  function render() {
    // No continuous spin -- it was fighting the live rebuild every
    // frame and made the growth direction hard to read while forming.
    const now = performance.now();
    const dt = lastRenderAt === null ? 0 : (now - lastRenderAt) / 1000;
    lastRenderAt = now;
    tickSparkles(dt);
    renderer.render(scene, camera);
  }

  // Same crop-aware mapping as the joystick pop-out.
  function videoPointToScreen(nx, ny) {
    const vw = camEl.videoWidth || window.innerWidth;
    const vh = camEl.videoHeight || window.innerHeight;
    const dw = window.innerWidth, dh = window.innerHeight;
    const scale = Math.max(dw / vw, dh / vh);
    const renderedW = vw * scale, renderedH = vh * scale;
    const offsetX = (dw - renderedW) / 2;
    const offsetY = (dh - renderedH) / 2;
    return { x: nx * vw * scale + offsetX, y: ny * vh * scale + offsetY };
  }

  // Vase profile: one radius per vertical bin (screen pixels), built
  // bottom-up as the fingertip rises. Revolved into a real 3D lathe
  // mesh each frame, not a flat 2D fill.
  const BIN_COUNT = 140;
  const TOP_MARGIN_FRAC = 0.05; // ceiling of the build zone, as a fraction
                                 // from the top of the screen -- always
                                 // reachable regardless of where you start

  // Fixed trigger zone: the disc and your hand's starting position are
  // both physically consistent take to take, so instead of anchoring to
  // "wherever tracking first happens to succeed" (which drifts, gets hit
  // by resize timing, and can trigger on a stray detection anywhere in
  // frame), the vase only starts building once your tracked point is
  // inside this zone. Estimated from your test footage (disc sits
  // center-left, lower half of frame) -- ADJUST THESE if the drawn
  // rectangle doesn't line up with your actual disc position.
  const DISC_ZONE_FRAC = { x0: 0.28, x1: 0.55, y0: 0.55, y1: 0.85 };
  function inDiscZone(fx, fy) {
    const xf = fx / window.innerWidth, yf = fy / window.innerHeight;
    return xf >= DISC_ZONE_FRAC.x0 && xf <= DISC_ZONE_FRAC.x1
        && yf >= DISC_ZONE_FRAC.y0 && yf <= DISC_ZONE_FRAC.y1;
  }
  function drawDiscZone(ctx2d) {
    const x0 = DISC_ZONE_FRAC.x0 * window.innerWidth;
    const x1 = DISC_ZONE_FRAC.x1 * window.innerWidth;
    const y0 = DISC_ZONE_FRAC.y0 * window.innerHeight;
    const y1 = DISC_ZONE_FRAC.y1 * window.innerHeight;
    ctx2d.save();
    ctx2d.strokeStyle = centerXFrac === null ? 'rgba(245,241,232,0.7)' : 'rgba(46,125,50,0.5)';
    ctx2d.lineWidth = 2;
    ctx2d.setLineDash([8, 6]);
    ctx2d.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx2d.restore();
  }

  let profile = new Array(BIN_COUNT).fill(null);
  // Stored as FRACTIONS of window width/height, not raw pixels -- entering
  // fullscreen (triggered on the same tap that starts tracking) can change
  // window.innerWidth/innerHeight shortly after your first touch is
  // captured, and raw pixel anchors would then be silently wrong for
  // every frame after that resize. Fractions stay valid regardless.
  let centerXFrac = null;
  let baseYFrac = null, topYFrac = null;
  let smoothTipX = null, smoothTipY = null;

  function getCenterX() { return centerXFrac * window.innerWidth; }
  function getBaseY() { return baseYFrac * window.innerHeight; }
  function getTopY() { return topYFrac * window.innerHeight; }

  let sparklesFired = false;

  function resetVase() {
    profile = new Array(BIN_COUNT).fill(null);
    centerXFrac = null;
    baseYFrac = null;
    topYFrac = null;
    smoothTipX = null;
    smoothTipY = null;
    sparklesFired = false;
    if (vaseMesh) {
      vaseGroup.remove(vaseMesh);
      vaseMesh.geometry.dispose();
      vaseMesh.material.dispose();
      vaseMesh = null;
    }
  }
  resetVase();

  // Raw fingertip input is jittery frame to frame -- a real pottery
  // profile is a smooth continuous curve, not a noisy polyline. Smooth
  // with a moving average before it ever reaches the geometry (the
  // stored profile itself stays raw/responsive; only the render pass
  // is smoothed).
  function smoothRadii(known, windowSize = 7) {
    const half = Math.floor(windowSize / 2);
    return known.map((p, idx) => {
      let sum = 0, count = 0;
      for (let k = -half; k <= half; k++) {
        const j = idx + k;
        if (j >= 0 && j < known.length) { sum += known[j].r; count++; }
      }
      return sum / count;
    });
  }

  function rebuildVase() {
    const known = profile.map((r, i) => ({ r, i })).filter(p => p.r !== null);
    if (known.length < 2 || centerXFrac === null) return;

    const smoothed = smoothRadii(known);
    const centerX = getCenterX(), baseY = getBaseY(), topY = getTopY();

    // LatheGeometry points: local (radius, height), bottom to top.
    // Radius floor keeps the base from pinching to a zero-width point.
    const points = known.map((p, idx) => {
      const worldY = screenToWorld(centerX, baseY - (p.i / BIN_COUNT) * (baseY - topY)).y;
      return new THREE.Vector2(Math.max(6, smoothed[idx]), worldY);
    });

    const geometry = new THREE.LatheGeometry(points, 48);
    geometry.computeVertexNormals();

    if (vaseMesh) {
      vaseMesh.geometry.dispose();
      vaseMesh.geometry = geometry;
    } else {
      const material = new THREE.MeshPhysicalMaterial({
        color: CLAY_COLOR,
        roughness: 0.55,
        metalness: 0.0,
        clearcoat: 0.25,
        clearcoatRoughness: 0.35,
        side: THREE.DoubleSide,
      });
      vaseMesh = new THREE.Mesh(geometry, material);
      vaseGroup.add(vaseMesh);
    }
  }

  // Runs every single frame, unconditionally -- NOT just while a hand is
  // being tracked. The old version only updated position.x inside
  // rebuildVase(), which only runs while tracking succeeds. If the
  // viewport resizes (fullscreen finishing its transition) while
  // tracking has dropped out -- which happens constantly -- the camera's
  // coordinate system moves on but the mesh position was left stale,
  // and it visibly drifts away from the anchor. This keeps it locked
  // to the anchor regardless of tracking state or resize timing.
  function syncVasePosition() {
    if (centerXFrac === null) return;
    const worldCenter = screenToWorld(getCenterX(), 0);
    vaseGroup.position.x = worldCenter.x;
  }

  function updateProfile(fx, fy) {
    if (centerXFrac === null) {
      if (!inDiscZone(fx, fy)) return; // not over the disc yet, don't anchor on a stray detection
      // First touch INSIDE the disc zone -- this becomes the base of
      // the vase, not just wherever tracking happened to first succeed.
      centerXFrac = fx / window.innerWidth;
      baseYFrac = fy / window.innerHeight;
      // Ceiling is always near the actual top of the screen, NOT a fixed
      // height above the start point -- a fixed height could (and did)
      // land above the visible frame if your hand starts partway down,
      // making part of the range physically unreachable. This way the
      // full bin range always maps to your full actual available travel,
      // wherever you happen to start.
      topYFrac = TOP_MARGIN_FRAC;
    }
    const centerX = getCenterX(), baseY = getBaseY(), topY = getTopY();
    const radius = Math.abs(fx - centerX);
    const t = (baseY - fy) / (baseY - topY); // 0 at base, 1 at top
    const bin = Math.round(Math.max(0, Math.min(1, t)) * (BIN_COUNT - 1));

    let lastKnown = -1;
    for (let i = bin; i >= 0; i--) { if (profile[i] !== null) { lastKnown = i; break; } }
    if (lastKnown === -1) {
      profile[bin] = radius;
    } else {
      const r0 = profile[lastKnown];
      for (let i = lastKnown; i <= bin; i++) {
        const f = (i - lastKnown) / Math.max(1, bin - lastKnown);
        profile[i] = r0 + (radius - r0) * f;
      }
    }
  }

  resetBtn.addEventListener('click', resetVase);

  const TRACKING_GRACE_MS = 500; // tolerate a brief AF/AE hunting blip
  let handLandmarker, running = false;
  let lastSeenAt = 0;

  async function start() {
    gate.classList.add('loading');
    gateText.textContent = 'Loading...';
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      // CPU delegate: GPU is known to be flaky on some Android GPUs
      // in-browser (same lesson as the joystick pop-out). Override
      // with ?delegate=gpu to A/B test without redeploying.
      const delegateParam = new URLSearchParams(location.search).get('delegate');
      const delegate = delegateParam === 'gpu' ? 'GPU' : 'CPU';
      status.textContent = `delegate: ${delegate}`;

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.2,
        minHandPresenceConfidence: 0.2,
        minTrackingConfidence: 0.2
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      camEl.srcObject = stream;
      await new Promise(r => camEl.onloadedmetadata = r);
      camEl.play();

      running = true;
      gate.classList.add('hidden');
      loop();
    } catch (err) {
      gate.classList.remove('loading');
      gateText.textContent = 'Failed to start: ' + err.message;
    }
  }

  function loop() {
    if (!running) return;
    const now = performance.now();
    let result;
    try {
      result = handLandmarker.detectForVideo(camEl, now);
    } catch (err) {
      status.textContent = 'detect error: ' + err.message;
      requestAnimationFrame(loop);
      return;
    }

    debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
    drawDiscZone(debugCtx); // white dashed = waiting for you to enter it, green = anchored

    if (result.landmarks && result.landmarks.length > 0) {
      lastSeenAt = now;
      const lm = result.landmarks[0];
      const tip = lm[18]; // pinky PIP joint (3rd point in from the tip: 20 tip, 19 DIP, 18 PIP)
                          // -- stays part of the palm shape, more stable than an
                          // isolated extended fingertip
      const rawSp = videoPointToScreen(tip.x, tip.y);

      // Smooth the fingertip position itself, not just the resulting
      // profile -- cuts jitter at the source instead of only after
      // it's already been baked into the vase shape.
      if (smoothTipX === null) { smoothTipX = rawSp.x; smoothTipY = rawSp.y; }
      smoothTipX += (rawSp.x - smoothTipX) * 0.4;
      smoothTipY += (rawSp.y - smoothTipY) * 0.4;
      const sp = { x: smoothTipX, y: smoothTipY };

      debugCtx.fillStyle = 'rgba(46, 125, 50, 0.85)';
      for (const p of lm) {
        const dp = videoPointToScreen(p.x, p.y);
        debugCtx.beginPath();
        debugCtx.arc(dp.x, dp.y, 5, 0, Math.PI * 2);
        debugCtx.fill();
      }
      debugCtx.fillStyle = 'rgba(232, 93, 20, 0.95)';
      debugCtx.beginPath();
      debugCtx.arc(sp.x, sp.y, 9, 0, Math.PI * 2);
      debugCtx.fill();

      updateProfile(sp.x, sp.y);
      rebuildVase();
      if (centerXFrac === null) {
        status.textContent = inDiscZone(sp.x, sp.y)
          ? 'over the disc -- hold to anchor'
          : `tip x:${sp.x.toFixed(0)} y:${sp.y.toFixed(0)} -- move into the dashed zone`;
      } else {
        const dbgCx = getCenterX().toFixed(0), dbgBy = getBaseY().toFixed(0), dbgTy = getTopY().toFixed(0);
        status.textContent = `tip x:${sp.x.toFixed(0)} y:${sp.y.toFixed(0)} | anchor cx:${dbgCx} baseY:${dbgBy} topY:${dbgTy} | win:${window.innerWidth}x${window.innerHeight}`;
      }
    } else if (now - lastSeenAt < TRACKING_GRACE_MS) {
      status.textContent = 'reacquiring...';
    } else {
      status.textContent = 'no hand';
      // Hand genuinely left frame (past the grace window) after a vase
      // was actually built -- fire the finishing sparkle burst once.
      if (vaseMesh && !sparklesFired) {
        sparklesFired = true;
        triggerSparkles();
      }
    }

    syncVasePosition(); // every frame, unconditionally -- see comment above
    render();
    requestAnimationFrame(loop);
  }

  gateBtn.addEventListener('click', () => {
    if (running) return;
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    start();
  });
</script>
</body>
</html>
