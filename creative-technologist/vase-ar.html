<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vase AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#16181C; overflow:hidden;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #cam {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1);
  }
  #overlay {
    position:fixed; inset:0; width:100%; height:100%;
    transform:scaleX(-1); /* match mirrored camera so the vase sits where the hand is */
  }

  #topbar {
    position:fixed; top:20px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 24px; z-index:10;
  }
  button {
    font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    background:#16181C; color:#F5F1E8; border:none;
    padding:10px 16px; border-radius:6px; cursor:pointer;
  }
  button.on { background:#2E7D32; }

  #status {
    position:fixed; bottom:20px; left:20px;
    color:#F5F1E8; font-size:12px; opacity:0.6; z-index:10;
  }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <button id="start">Start camera</button>
    <button id="reset">Reset vase</button>
  </div>
  <div id="status">--</div>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  const camEl = document.getElementById('cam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');
  const status = document.getElementById('status');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Vase profile: one radius per vertical bin, built bottom-up as the
  // fingertip rises. BASE_Y/TOP_Y define the build zone on screen.
  const BIN_COUNT = 140;
  let profile = new Array(BIN_COUNT).fill(null);
  let centerX = null;
  let baseY, topY;

  function resetVase() {
    profile = new Array(BIN_COUNT).fill(null);
    centerX = null;
    baseY = canvas.height * 0.92;
    topY = canvas.height * 0.12;
  }
  resetVase();

  function drawVase() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const known = profile.map((r, i) => ({ r, i })).filter(p => p.r !== null);
    if (known.length < 2 || centerX === null) return;

    ctx.beginPath();
    // right edge, bottom to top
    for (const p of known) {
      const y = baseY - (p.i / BIN_COUNT) * (baseY - topY);
      const x = centerX + p.r;
      if (p === known[0]) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    // left edge, top to bottom
    for (let k = known.length - 1; k >= 0; k--) {
      const p = known[k];
      const y = baseY - (p.i / BIN_COUNT) * (baseY - topY);
      const x = centerX - p.r;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(227, 185, 138, 0.88)'; // warm sand, matches the palette
    ctx.fill();
    ctx.strokeStyle = 'rgba(58, 46, 0, 0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function updateProfile(fx, fy) {
    if (centerX === null) centerX = fx; // lock the axis to where tracking starts
    const radius = Math.abs(fx - centerX);
    const t = (baseY - fy) / (baseY - topY); // 0 at base, 1 at top
    const bin = Math.round(Math.max(0, Math.min(1, t)) * (BIN_COUNT - 1));

    // fill from the last known bin up to this one, so fast moves don't gap
    let lastKnown = -1;
    for (let i = bin; i >= 0; i--) { if (profile[i] !== null) { lastKnown = i; break; } }
    if (lastKnown === -1) {
      profile[bin] = radius;
    } else {
      const r0 = profile[lastKnown];
      for (let i = lastKnown; i <= bin; i++) {
        const f = (i - lastKnown) / Math.max(1, bin - lastKnown);
        profile[i] = r0 + (radius - r0) * f;
      }
    }
  }

  resetBtn.addEventListener('click', resetVase);

  let handLandmarker, running = false;

  async function start() {
    startBtn.textContent = 'Loading model...';
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });

    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    camEl.srcObject = stream;
    await new Promise(r => camEl.onloadedmetadata = r);
    camEl.play();

    running = true;
    startBtn.textContent = 'Running';
    startBtn.classList.add('on');
    loop();
  }

  function loop() {
    if (!running) return;
    const now = performance.now();
    const result = handLandmarker.detectForVideo(camEl, now);

    if (result.landmarks && result.landmarks.length > 0) {
      const tip = result.landmarks[0][8]; // index fingertip, normalized 0-1
      const fx = tip.x * canvas.width;
      const fy = tip.y * canvas.height;
      updateProfile(fx, fy);
      status.textContent = `tracking  x:${fx.toFixed(0)} y:${fy.toFixed(0)}`;
    } else {
      status.textContent = 'no hand detected';
    }

    drawVase();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => { if (!running) start(); });
</script>
</body>
</html>
