<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joystick — LEGO Digital Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --accent: #E85D14;
    --ink: #16181C;
    --paper: #F5F1E8;
  }
  html, body {
    height:100%;
    background:#0A0B0D;
    font-family:var(--sans);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }

  /* ---- ambient background: dot grid + soft glow + scanline sweep ---- */
  body::before {
    content:''; position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events:none;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse 900px 600px at 50% 45%, rgba(232,93,20,0.10), transparent 70%);
    pointer-events:none;
  }
  #scanline {
    position:fixed; left:0; right:0; height:140px; top:-140px;
    background:linear-gradient(to bottom, transparent, rgba(232,93,20,0.05), transparent);
    animation: scanline 9s linear infinite;
    pointer-events:none;
  }
  @keyframes scanline { 0% { transform:translateY(0); } 100% { transform:translateY(calc(100vh + 140px)); } }

  /* ---- corner HUD brackets framing the whole rig ---- */
  .bracket {
    position:fixed; width:26px; height:26px;
    border:1.5px solid rgba(232,93,20,0.45);
    pointer-events:none;
  }
  .bracket.tl { top:26px; left:26px; border-right:none; border-bottom:none; }
  .bracket.tr { top:26px; right:26px; border-left:none; border-bottom:none; }
  .bracket.bl { bottom:26px; left:26px; border-right:none; border-top:none; }
  .bracket.br { bottom:26px; right:26px; border-left:none; border-top:none; }

  /* ---- bounded app card ---- */
  #app {
    position:relative;
    width:min(980px, 92vw);
    height:min(680px, 88vh);
    background:var(--paper);
    border-radius:20px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,93,20,0.12);
    overflow:hidden;
  }
  #app.flash::before {
    content:''; position:absolute; inset:0; z-index:20; pointer-events:none;
    background:linear-gradient(100deg, transparent 40%, rgba(232,93,20,0.35) 50%, transparent 60%);
    background-size:250% 100%;
    background-position:150% 0;
    animation: sweep .7s ease-out;
  }
  @keyframes sweep { from { background-position:150% 0; } to { background-position:-50% 0; } }

  #stage {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- top bar / system readout ---- */
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px;
    z-index:10;
    border-bottom:1px solid rgba(22,24,28,0.08);
  }
  .link-group { display:flex; align-items:center; gap:10px; }
  #status-dot {
    width:7px; height:7px; border-radius:50%;
    background:#C77A1E;
    box-shadow: 0 0 0 0 rgba(199,122,30,0.5);
    animation: pulse-amber 1.6s ease-in-out infinite;
    flex-shrink:0;
  }
  #status-dot.connected {
    background:#2E7D32;
    animation: pulse-green 1.6s ease-in-out infinite;
  }
  @keyframes pulse-amber { 0%,100% { box-shadow:0 0 0 0 rgba(199,122,30,0.45); } 50% { box-shadow:0 0 0 6px rgba(199,122,30,0); } }
  @keyframes pulse-green { 0%,100% { box-shadow:0 0 0 0 rgba(46,125,50,0.45); } 50% { box-shadow:0 0 0 6px rgba(46,125,50,0); } }

  button { font-family:var(--mono); }
  #connect {
    font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none;
    padding:9px 14px; border-radius:6px; cursor:pointer;
    transition: transform .12s ease, background .2s ease;
  }
  #connect:hover { transform:translateY(-1px); }
  #connect.connected { background:#2E7D32; }
  #test-signal {
    font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    background:transparent; color:#8A8D94; border:1px solid rgba(22,24,28,0.15);
    padding:8px 13px; border-radius:6px; cursor:pointer;
    margin-left:8px;
    transition: border-color .15s ease, color .15s ease;
  }
  #test-signal:hover { border-color:var(--accent); color:var(--ink); }
  #refresh {
    width:34px; height:34px; border-radius:8px;
    background:var(--ink); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  #refresh:hover svg { transform:rotate(180deg); }
  #refresh svg { width:16px; height:16px; stroke:var(--paper); transition: transform .3s cubic-bezier(.2,.8,.2,1); }

  #waiting {
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    color:#8A8D94; font-family:var(--mono); font-size:11px; letter-spacing:.04em;
    z-index:10;
    display:flex; align-items:center; gap:8px;
  }
  #waiting .cursor {
    display:inline-block; width:6px; height:12px; background:var(--accent);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* ---- waiting scan ring, shows only pre-arrival ---- */
  #scan-ring {
    position:absolute; top:50%; left:50%; width:160px; height:160px;
    transform:translate(-50%,-50%);
    border:1.5px dashed rgba(22,24,28,0.18);
    border-radius:50%;
    animation: spin 12s linear infinite;
    z-index:1;
  }
  #app.arrived #scan-ring { display:none; }

  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

  /* ---- cross layout ---- */
  #cross {
    position:relative;
    width:460px; height:460px;
    z-index:2;
  }
  .brick {
    position:absolute;
    width:165px; height:165px;
    border:none; background:none; cursor:pointer;
    padding:0;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), filter .18s ease;
  }
  .brick img { width:100%; height:100%; object-fit:contain; display:block; }
  .brick:hover { filter: drop-shadow(0 0 10px rgba(232,93,20,0.35)); }
  .brick:active, .brick.pressed {
    transform: scale(0.94) !important;
    filter: drop-shadow(0 0 14px rgba(232,93,20,0.6));
  }

  #up    { top:2px;    left:50%; transform:translateX(-50%); animation: bob-v 4.2s ease-in-out infinite; }
  #down  { bottom:2px; left:50%; transform:translateX(-50%); animation: bob-v 4.6s ease-in-out infinite .3s; }
  #left  { left:2px;   top:50%;  transform:translateY(-50%); animation: bob-h 4.4s ease-in-out infinite .15s; }
  #right { right:2px;  top:50%;  transform:translateY(-50%); animation: bob-h 4.8s ease-in-out infinite .45s; }
  @keyframes bob-v { 0%,100% { margin-top:0; } 50% { margin-top:4px; } }
  @keyframes bob-h { 0%,100% { margin-left:0; } 50% { margin-left:4px; } }

  #up.pressed    { transform:translateX(-50%) scale(0.94) !important; animation:none; }
  #down.pressed  { transform:translateX(-50%) scale(0.94) !important; animation:none; }
  #left.pressed  { transform:translateY(-50%) scale(0.94) !important; animation:none; }
  #right.pressed { transform:translateY(-50%) scale(0.94) !important; animation:none; }

  /* ---- minifigure, center ---- */
  #minifig-wrap {
    position:absolute; top:50%; left:50%;
    transform: translate(-50%, -50%);
    width:120px; height:120px;
    z-index:5;
    cursor:pointer; /* click = simulated JOY:CLICK, for rehearsal without hardware */
  }
  #minifig-wrap img {
    width:100%; height:100%; object-fit:contain;
    transition: opacity .25s ease;
  }

  /* ---- caption: terminal-style readout ---- */
  #caption {
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px) scale(0.96);
    max-width:88%; width:auto;
    background:var(--ink); color:var(--paper);
    padding:16px 22px 14px; border-radius:10px;
    border-left:3px solid var(--accent);
    text-align:left;
    opacity:0; pointer-events:none;
    transition: opacity .3s cubic-bezier(.2,.8,.2,1), transform .3s cubic-bezier(.2,.8,.2,1);
    z-index:10;
  }
  #caption.visible { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  #caption .tag {
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:4px; display:block;
  }
  #caption .line {
    font-size:15px; font-weight:500; letter-spacing:-0.01em;
  }

  /* ---- dismantle ---- */
  #cross.dismantled .brick {
    transition: transform .6s ease, opacity .6s ease;
    opacity:0; animation:none;
  }
  #cross.dismantled #up    { transform: translateX(-50%) translateY(-260px) !important; }
  #cross.dismantled #down  { transform: translateX(-50%) translateY(260px) !important; }
  #cross.dismantled #left  { transform: translateY(-50%) translateX(-260px) !important; }
  #cross.dismantled #right { transform: translateY(-50%) translateX(260px) !important; }

  /* ---- maker reveal: full photo, text overlaid on it ---- */
  #maker-reveal {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .5s ease .3s;
    z-index:6;
  }
  #maker-reveal.visible { opacity:1; }
  #maker-reveal img {
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  #maker-reveal .scrim {
    position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
  }
  #maker-reveal .tag {
    position:absolute; left:0; right:0; bottom:64px; text-align:center;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent);
  }
  #maker-reveal .line {
    position:absolute; left:0; right:0; bottom:28px;
    text-align:center;
    color:var(--paper);
    font-size:clamp(22px, 3.4vw, 34px);
    font-weight:700; letter-spacing:-0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

  <div id="scanline"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div id="app">
    <div id="topbar">
      <div class="link-group">
        <span id="status-dot"></span>
        <button id="connect">Connect Joystick</button>
        <button id="test-signal" title="Rehearse the entrance without the phone">Test signal</button>
      </div>
      <button id="refresh" title="Reset (for retakes)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
    <div id="waiting"><span class="cursor"></span>waiting for drop signal...</div>
    <div id="scan-ring"></div>

    <div id="stage">
      <div id="cross">
        <button class="brick" id="up"    data-dir="up">   <img src="./assets/lego_yellow.png" alt=""></button>
        <button class="brick" id="right" data-dir="right"><img src="./assets/lego_red.png" alt=""></button>
        <button class="brick" id="down"  data-dir="down"> <img src="./assets/lego_blue.png" alt=""></button>
        <button class="brick" id="left"  data-dir="left"> <img src="./assets/lego_green.png" alt=""></button>

        <div id="minifig-wrap">
          <img id="minifig-img" src="./assets/minifig_default.png" alt="">
        </div>
      </div>
    </div>

    <div id="caption"><span class="tag">Direction</span><span class="line" id="caption-line"></span></div>

    <div id="maker-reveal">
      <img src="./assets/minifig_maker.png" alt="">
      <div class="scrim"></div>
      <div class="tag">Core access granted</div>
      <div class="line">AT THE CORE, I AM A MAKER.</div>
    </div>
  </div>

<script src="./serial-hub.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="./remote-trigger.js"></script>
<script>
  const COPY = {
    up:    "I am an Industrial / Product Designer and a Mechanical Engineer.",
    right: "I am Head of Product and Design at OIMake, a DIY tech toy brand in India.",
    down:  "I am an early stage entrepreneur.",
    left:  "I am building Makeable, to help people with DFM for injection moulded parts, and its correct costing."
  };

  // The generated minifig_left/minifig_right poses point the OPPOSITE
  // way their filenames suggest (arm extended toward the other side of
  // frame) -- mapped here by what they actually show, not their names.
  const MINIFIG_IMG = {
    up:      './assets/minifig_up.png',
    down:    './assets/minifig_down.png',
    left:    './assets/minifig_right.png', // shows arm pointing screen-left
    right:   './assets/minifig_left.png',  // shows arm pointing screen-right
    default: './assets/minifig_default.png',
  };

  const app = document.getElementById('app');
  const cross = document.getElementById('cross');
  const minifigImg = document.getElementById('minifig-img');
  const caption = document.getElementById('caption');
  const captionLine = document.getElementById('caption-line');
  const makerReveal = document.getElementById('maker-reveal');
  const connectBtn = document.getElementById('connect');
  const statusDot = document.getElementById('status-dot');
  const refreshBtn = document.getElementById('refresh');
  const testSignalBtn = document.getElementById('test-signal');
  const waitingLabel = document.getElementById('waiting');
  const minifigWrap = document.getElementById('minifig-wrap');

  let dismantled = false;
  let arrived = false; // has the entrance signal landed yet?

  // Starts off-screen (reusing the dismantled positions) until the
  // phone's drop signal arrives, then flies into place.
  cross.classList.add('dismantled');
  minifigWrap.style.opacity = '0';

  function playEntrance() {
    if (arrived) return;
    arrived = true;
    app.classList.add('arrived');
    waitingLabel.style.display = 'none';
    cross.classList.remove('dismantled');
    minifigWrap.style.opacity = '1';
    app.classList.add('flash');
    setTimeout(() => app.classList.remove('flash'), 750);
  }

  RemoteTrigger.onTrigger(playEntrance);
  testSignalBtn.addEventListener('click', playEntrance); // rehearsal without the phone

  window.addEventListener('remote-trigger-status', (e) => {
    waitingLabel.innerHTML = `<span class="cursor"></span>waiting for drop signal... (${e.detail})`;
  });

  function pointAt(dir) {
    minifigImg.src = MINIFIG_IMG[dir || 'default'];
  }

  function showDirection(dir) {
    if (dismantled || !arrived) return;
    document.querySelectorAll('.brick').forEach(b => b.classList.remove('pressed'));
    const btn = document.querySelector(`.brick[data-dir="${dir}"]`);
    if (btn) btn.classList.add('pressed');
    pointAt(dir);
    captionLine.textContent = COPY[dir];
    caption.classList.add('visible');
  }

  function clearDirection() {
    if (dismantled || !arrived) return;
    document.querySelectorAll('.brick').forEach(b => b.classList.remove('pressed'));
    pointAt(null);
    caption.classList.remove('visible');
  }

  function dismantle() {
    if (dismantled || !arrived) return;
    dismantled = true;
    cross.classList.add('dismantled');
    caption.classList.remove('visible');
    minifigWrap.style.opacity = '0';
    makerReveal.classList.add('visible');
    app.classList.add('flash');
    setTimeout(() => app.classList.remove('flash'), 750);
  }

  function reset() {
    dismantled = false;
    arrived = false;
    app.classList.remove('arrived');
    cross.classList.add('dismantled'); // back to off-screen, waiting for the next drop signal
    minifigWrap.style.opacity = '0';
    makerReveal.classList.remove('visible');
    waitingLabel.style.display = 'flex';
    caption.classList.remove('visible');
  }

  // mouse/touch fallback, also useful for rehearsal without hardware
  document.querySelectorAll('.brick').forEach(b => {
    b.addEventListener('click', () => showDirection(b.dataset.dir));
  });

  refreshBtn.addEventListener('click', reset);
  minifigWrap.addEventListener('click', dismantle); // rehearsal without hardware

  window.addEventListener('serial-msg', (e) => {
    const msg = e.detail;
    if (msg === 'JOY:UP') showDirection('up');
    else if (msg === 'JOY:DOWN') showDirection('down');
    else if (msg === 'JOY:LEFT') showDirection('left');
    else if (msg === 'JOY:RIGHT') showDirection('right');
    else if (msg === 'JOY:CENTER') clearDirection();
    else if (msg === 'JOY:CLICK') dismantle();
  });

  window.addEventListener('serial-status', (e) => {
    if (e.detail === 'connected') {
      connectBtn.textContent = 'Connected';
      connectBtn.classList.add('connected');
      statusDot.classList.add('connected');
    } else if (e.detail === 'disconnected' || e.detail === 'error') {
      connectBtn.textContent = 'Connect Joystick';
      connectBtn.classList.remove('connected');
      statusDot.classList.remove('connected');
    }
  });

  connectBtn.addEventListener('click', async () => {
    try { await SerialHub.connect(); }
    catch (err) { alert(err.message); }
  });
</script>
</body>
</html>
