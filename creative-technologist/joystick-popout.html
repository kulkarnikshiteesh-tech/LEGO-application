<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joystick Pop-out AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#16181C; overflow:hidden;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #cam {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* rear camera: no mirror -- what you see is what's actually there */
  }
  #three-canvas {
    position:fixed; inset:0; width:100%; height:100%;
  }
  #debug-dots {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:15; pointer-events:none;
  }

  /* ---- pre-start gate: big touch target, both hands are busy once running ---- */
  #gate {
    position:fixed; inset:0; z-index:20;
    background:#16181C;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    transition:opacity .4s ease;
  }
  #gate.hidden { opacity:0; pointer-events:none; }
  #gate-btn {
    width:110px; height:110px; border-radius:50%;
    background:#E85D14; border:none;
    display:flex; align-items:center; justify-content:center;
  }
  #gate-btn svg { width:40px; height:40px; fill:#16181C; }
  #gate p {
    color:#8A8D94; font-size:14px; max-width:280px; text-align:center; line-height:1.5;
  }
  #gate.loading #gate-btn { opacity:0.5; }

  /* ---- minimal recording chrome, fades out once running ---- */
  #chrome {
    position:fixed; inset:0; z-index:10;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  #status {
    position:fixed; bottom:16px; left:16px;
    color:#F5F1E8; font-size:11px; opacity:0.55;
  }
  #reset {
    position:fixed; top:16px; right:16px;
    width:36px; height:36px; border-radius:8px;
    background:rgba(22,24,28,0.55); border:none;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
  }
  #reset svg { width:18px; height:18px; stroke:#F5F1E8; }
  #chrome.recording-clean #status { display:none; }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="debug-dots"></canvas>

  <div id="chrome">
    <div id="status">--</div>
    <div id="mqtt-status" style="position:fixed; bottom:36px; left:16px; color:#F5F1E8; font-size:11px; opacity:0.55;">signal: --</div>
    <button id="reset" title="Reset (for retakes)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </div>

  <div id="gate">
    <button id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p>Rear camera + hand tracking. Tap once, then it's hands-free: bring your hand into frame near the joystick to pick the model up, move it toward the laptop, then move your hand out of frame to drop it.</p>
  </div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="./remote-trigger.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
  import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js";

  const camEl = document.getElementById('cam');
  const canvasEl = document.getElementById('three-canvas');
  const debugCanvas = document.getElementById('debug-dots');
  const debugCtx = debugCanvas.getContext('2d');
  const gate = document.getElementById('gate');
  const gateBtn = document.getElementById('gate-btn');
  const gateText = gate.querySelector('p');
  const chromeEl = document.getElementById('chrome');
  const resetBtn = document.getElementById('reset');
  const status = document.getElementById('status');
  const mqttStatusEl = document.getElementById('mqtt-status');
  window.addEventListener('remote-trigger-status', (e) => {
    mqttStatusEl.textContent = 'signal: ' + e.detail;
  });
  RemoteTrigger.preconnect(); // connect early so status is known before the drop happens

  // ---- three.js scene, orthographic camera mapped 1:1 to screen pixels ----
  // so the model can be placed exactly under the pinch point.
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
  const scene = new THREE.Scene();
  let camera;

  function makeCamera() {
    const w = window.innerWidth, h = window.innerHeight;
    camera = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 2000);
    camera.position.z = 500;
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    makeCamera();
    debugCanvas.width = window.innerWidth;
    debugCanvas.height = window.innerHeight;
  }

  // The <video> is object-fit:cover, so the on-screen image is a CROPPED,
  // scaled view of the raw camera frame. Landmark coordinates come back
  // normalized (0-1) against the RAW frame, not the cropped display -- so
  // they need to go through this same crop math or they land in the
  // wrong place (and by enough that a hand near the crop edge can look
  // "lost" even though it's still fine in the raw frame).
  function videoPointToScreen(nx, ny) {
    const vw = camEl.videoWidth || window.innerWidth;
    const vh = camEl.videoHeight || window.innerHeight;
    const dw = window.innerWidth, dh = window.innerHeight;
    const scale = Math.max(dw / vw, dh / vh);
    const renderedW = vw * scale, renderedH = vh * scale;
    const offsetX = (dw - renderedW) / 2;
    const offsetY = (dh - renderedH) / 2;
    return {
      x: nx * vw * scale + offsetX,
      y: ny * vh * scale + offsetY,
    };
  }
  window.addEventListener('resize', resize);
  resize();

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(1, 1, 1);
  scene.add(dirLight);

  // ---- PLACEHOLDER joystick model (procedural), shown instantly while
  // the real GLB loads in the background, then swapped out.
  function buildPlaceholder() {
    // Local origin is the TOP of the knob (not the model's center) --
    // that's the point that gets pinned to your pinch.
    const group = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(45, 55, 22, 24),
      new THREE.MeshStandardMaterial({ color: 0x2c2f36 })
    );
    base.position.y = -98;
    const stick = new THREE.Mesh(
      new THREE.CylinderGeometry(7, 7, 70, 16),
      new THREE.MeshStandardMaterial({ color: 0x16181c })
    );
    stick.position.y = -53;
    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(16, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xe85d14 })
    );
    knob.position.y = -16;
    group.add(base, stick, knob);
    return group;
  }

  let model = buildPlaceholder();
  let currentScale = 0;
  model.scale.setScalar(currentScale);
  model.visible = false; // hidden until a pinch actually starts -- scale alone
                          // isn't reliable once the real GLB's normalization
                          // factor gets multiplied in (see loader below)
  scene.add(model);

  const TARGET_HEIGHT = 130; // world units, matches placeholder's rough size
  const loader = new GLTFLoader();
  loader.load('./assets/joystick.glb', (gltf) => {
    const real = gltf.scene;
    const box = new THREE.Box3().setFromObject(real);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    // Anchor at the TOP center, not the geometric center, so the top of
    // the model is what gets pinned to your pinch point as you drag.
    const topAnchor = new THREE.Vector3(center.x, box.max.y, center.z);
    real.position.sub(topAnchor);

    const wrapper = new THREE.Group();
    wrapper.add(real);
    const scaleFactor = TARGET_HEIGHT / Math.max(size.y, 0.001);
    wrapper.userData.baseScale = scaleFactor;

    wrapper.position.copy(model.position);
    wrapper.rotation.copy(model.rotation);
    wrapper.visible = model.visible; // carry over hidden/shown state, don't
                                      // let a fresh default-visible Group
                                      // reveal it mid-idle
    wrapper.scale.setScalar(currentScale * scaleFactor);

    scene.remove(model);
    scene.add(wrapper);
    model = wrapper;
  }, undefined, (err) => {
    console.error('joystick.glb failed to load, staying on placeholder', err);
  });

  function screenToScene(x, y) {
    return {
      x: x - window.innerWidth / 2,
      y: -(y - window.innerHeight / 2),
    };
  }

  function render() {
    renderer.render(scene, camera);
  }

  // ---- hand PRESENCE (not gesture) drives grab/drop ----
  // Gesture classification (fist/thumbs-up) proved unreliable for this
  // setup -- false positives on an open hand, false negatives on a real
  // grip. Hand presence is much more robust: model follows your hand
  // whenever the camera can see it, and settles ("drops") once your
  // hand has been out of frame for longer than the grace window.
  // Phases: 'idle' (hidden) -> 'growing' (pop-in where your hand first
  // appears) -> 'following' (tracks every frame) -> 'dropped' (settles
  // once your hand's been gone past TRACKING_GRACE_MS; re-appearing
  // your hand picks it back up again).
  const TARGET_SCALE = 1.4;
  const TRACKING_GRACE_MS = 500; // tolerate a brief AF/AE hunting blip
                                  // without treating it as hand-lost
  let pinching = false; // true while hand is present/tracked (name kept for minimal diff)
  let phase = 'idle';
  let t = 0;
  let lastSeenAt = 0;
  let delivered = false; // true once the real drop has fired -- stops the
                          // model popping back up if your hand re-enters
                          // frame later in a continuous, uncut recording

  function applyScale(mult = 1) {
    const factor = model.userData.baseScale || 1;
    model.scale.setScalar(currentScale * factor * mult);
  }

  function updateGrabPosition(fx, fy) {
    const p = screenToScene(fx, fy);
    model.position.x = p.x;
    model.position.y = p.y;
  }

  function startGrab(fx, fy) {
    updateGrabPosition(fx, fy);
    if (phase === 'idle') {
      phase = 'growing';
      t = 0;
      model.visible = true;
    } else if (phase === 'dropped') {
      // re-grabbing after a drop -- already visible/full-size, just
      // resume tracking instead of re-running the pop-in animation
      phase = 'following';
    } else if (phase === 'fading') {
      // caught it mid-fade -- snap back to full size and resume
      currentScale = TARGET_SCALE;
      applyScale();
      phase = 'following';
    }
  }

  function releaseGrab() {
    if (phase === 'growing' || phase === 'following') {
      phase = 'dropped';
      t = 0;
      delivered = true; // no more pickups after this -- one drop per take
      RemoteTrigger.fire(); // tells the laptop to build the interface in
    }
  }

  function tickPopAnim() {
    if (phase === 'growing') {
      t += 0.09; // quick pop-in, ~150ms
      const p = Math.min(1, t);
      currentScale = THREE.MathUtils.lerp(0, TARGET_SCALE, p);
      applyScale();
      if (p >= 1) { currentScale = TARGET_SCALE; phase = 'following'; }
    } else if (phase === 'following') {
      currentScale = TARGET_SCALE;
      applyScale();
    } else if (phase === 'dropped') {
      t += 0.06;
      const squash = Math.sin(Math.min(t, 1) * Math.PI) * Math.exp(-t * 2.5);
      currentScale = TARGET_SCALE;
      applyScale(1 + squash * 0.15); // small landing bounce, then settles flat
      if (t >= 1.5) { phase = 'fading'; t = 0; } // bounce settled, start the fade-out
    } else if (phase === 'fading') {
      t += 0.025;
      const p = Math.min(1, t);
      currentScale = TARGET_SCALE * (1 - p); // shrink away rather than relying on material opacity
      applyScale();
      model.position.y += 0.6; // drift gently upward as it disappears
      if (p >= 1) {
        model.visible = false;
        phase = 'idle';
        currentScale = 0;
      }
    }
  }

  function resetAll() {
    phase = 'idle';
    t = 0;
    currentScale = 0;
    applyScale();
    model.visible = false;
    pinching = false;
    delivered = false;
  }
  resetBtn.addEventListener('click', resetAll);

  // ---- MediaPipe hand tracking ----
  let gestureRecognizer, running = false;

  async function start() {
    gate.classList.add('loading');
    gateText.textContent = 'Loading...';
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      // GPU delegate is known to be flaky on some Android GPUs in-browser.
      // Default to CPU (slower but more consistent); override with
      // ?delegate=gpu in the URL to A/B test without redeploying.
      const delegateParam = new URLSearchParams(location.search).get('delegate');
      const delegate = delegateParam === 'gpu' ? 'GPU' : 'CPU';
      status.textContent = `delegate: ${delegate}`;

      // Only using this for its hand landmarks/presence now (gesture
      // classification turned out unreliable for this setup) -- kept
      // the GestureRecognizer model since it's already wired up and
      // returns the same landmarks HandLandmarker would.
      gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.3,
        minHandPresenceConfidence: 0.3,
        minTrackingConfidence: 0.3
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        // lower resolution than before -- less for continuous AF/AE to
        // hunt over when the background composition changes, and it's
        // plenty for hand tracking
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      camEl.srcObject = stream;
      await new Promise(r => camEl.onloadedmetadata = r);
      camEl.play();

      running = true;
      gate.classList.add('hidden');
      // debug readout auto-hide disabled while we calibrate pinch detection
      // -- re-enable with: setTimeout(() => chromeEl.classList.add('recording-clean'), 1500);
      loop();
    } catch (err) {
      gate.classList.remove('loading');
      gateText.textContent = 'Failed to start: ' + err.message;
    }
  }

  function loop() {
    if (!running) return;
    const now = performance.now();
    let result;
    try {
      result = gestureRecognizer.recognizeForVideo(camEl, now);
    } catch (err) {
      status.textContent = 'detect error: ' + err.message;
      requestAnimationFrame(loop); // keep the loop alive, don't die on one bad frame
      return;
    }

    debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);

    if (result.landmarks && result.landmarks.length > 0) {
      lastSeenAt = now;
      const lm = result.landmarks[0];

      // palm center (wrist + middle-knuckle midpoint) -- stable even
      // when fingers move around, unlike a fingertip pair
      const wrist = lm[0], midKnuckle = lm[9];
      const palmPt = videoPointToScreen(
        (wrist.x + midKnuckle.x) / 2,
        (wrist.y + midKnuckle.y) / 2
      );
      const fx = palmPt.x, fy = palmPt.y;

      // draw every landmark so you can see exactly what the camera sees
      debugCtx.fillStyle = 'rgba(46, 125, 50, 0.85)';
      for (const p of lm) {
        const sp = videoPointToScreen(p.x, p.y);
        debugCtx.beginPath();
        debugCtx.arc(sp.x, sp.y, 5, 0, Math.PI * 2);
        debugCtx.fill();
      }
      debugCtx.fillStyle = 'rgba(232, 93, 20, 0.95)';
      debugCtx.beginPath();
      debugCtx.arc(fx, fy, 9, 0, Math.PI * 2);
      debugCtx.fill();

      // Presence alone drives pickup: hand visible = carrying it.
      // Skipped entirely once delivered -- one drop per take, so your
      // hand re-entering frame later doesn't pop the model back up.
      if (!delivered) {
        if (!pinching) {
          pinching = true;
          startGrab(fx, fy);
        } else {
          updateGrabPosition(fx, fy);
        }
      }

      status.textContent = `hand tracked, phase=${phase}, delivered=${delivered}`;
    } else if (now - lastSeenAt < TRACKING_GRACE_MS) {
      // brief dropout (likely AF/AE hunting on a background change) --
      // hold position and pinch state instead of dropping the model
      status.textContent = `reacquiring... phase=${phase}`;
    } else {
      if (pinching) {
        pinching = false;
        releaseGrab();
      }
      status.textContent = `no hand, phase=${phase}`;
    }

    tickPopAnim();
    render();
    requestAnimationFrame(loop);
  }

  gateBtn.addEventListener('click', () => {
    if (running) return;
    // must be requested synchronously inside the click handler, before
    // any await, or the browser won't treat it as a real user gesture
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    start();
  });
</script>
</body>
</html>
