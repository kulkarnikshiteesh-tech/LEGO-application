<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joystick Pop-out AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#16181C; overflow:hidden;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #cam {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* rear camera: no mirror -- what you see is what's actually there */
  }
  #three-canvas {
    position:fixed; inset:0; width:100%; height:100%;
  }

  /* ---- pre-start gate: big touch target, both hands are busy once running ---- */
  #gate {
    position:fixed; inset:0; z-index:20;
    background:#16181C;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    transition:opacity .4s ease;
  }
  #gate.hidden { opacity:0; pointer-events:none; }
  #gate-btn {
    width:110px; height:110px; border-radius:50%;
    background:#E85D14; border:none;
    display:flex; align-items:center; justify-content:center;
  }
  #gate-btn svg { width:40px; height:40px; fill:#16181C; }
  #gate p {
    color:#8A8D94; font-size:14px; max-width:280px; text-align:center; line-height:1.5;
  }
  #gate.loading #gate-btn { opacity:0.5; }

  /* ---- minimal recording chrome, fades out once running ---- */
  #chrome {
    position:fixed; inset:0; z-index:10;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  #status {
    position:fixed; bottom:16px; left:16px;
    color:#F5F1E8; font-size:11px; opacity:0.55;
  }
  #reset {
    position:fixed; top:16px; right:16px;
    width:36px; height:36px; border-radius:8px;
    background:rgba(22,24,28,0.55); border:none;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
  }
  #reset svg { width:18px; height:18px; stroke:#F5F1E8; }
  #chrome.recording-clean #status { display:none; }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>

  <div id="chrome">
    <div id="status">--</div>
    <button id="reset" title="Reset (for retakes)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </div>

  <div id="gate">
    <button id="gate-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p>Rear camera + hand tracking. Tap once, then it's hands-free, pinch the joystick to pull the model out.</p>
  </div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
  import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js";

  const camEl = document.getElementById('cam');
  const canvasEl = document.getElementById('three-canvas');
  const gate = document.getElementById('gate');
  const gateBtn = document.getElementById('gate-btn');
  const gateText = gate.querySelector('p');
  const chromeEl = document.getElementById('chrome');
  const resetBtn = document.getElementById('reset');
  const status = document.getElementById('status');

  // ---- three.js scene, orthographic camera mapped 1:1 to screen pixels ----
  // so the model can be placed exactly under the pinch point.
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
  const scene = new THREE.Scene();
  let camera;

  function makeCamera() {
    const w = window.innerWidth, h = window.innerHeight;
    camera = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 2000);
    camera.position.z = 500;
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    makeCamera();
  }
  window.addEventListener('resize', resize);
  resize();

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(1, 1, 1);
  scene.add(dirLight);

  // ---- PLACEHOLDER joystick model (procedural), shown instantly while
  // the real GLB loads in the background, then swapped out.
  function buildPlaceholder() {
    const group = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(45, 55, 22, 24),
      new THREE.MeshStandardMaterial({ color: 0x2c2f36 })
    );
    base.position.y = -40;
    const stick = new THREE.Mesh(
      new THREE.CylinderGeometry(7, 7, 70, 16),
      new THREE.MeshStandardMaterial({ color: 0x16181c })
    );
    stick.position.y = 5;
    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(16, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xe85d14 })
    );
    knob.position.y = 42;
    group.add(base, stick, knob);
    return group;
  }

  let model = buildPlaceholder();
  let currentScale = 0.0001;
  model.scale.setScalar(currentScale);
  scene.add(model);

  const TARGET_HEIGHT = 130; // world units, matches placeholder's rough size
  const loader = new GLTFLoader();
  loader.load('./assets/joystick.glb', (gltf) => {
    const real = gltf.scene;
    const box = new THREE.Box3().setFromObject(real);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    real.position.sub(center);

    const wrapper = new THREE.Group();
    wrapper.add(real);
    const scaleFactor = TARGET_HEIGHT / Math.max(size.y, 0.001);
    wrapper.userData.baseScale = scaleFactor;

    wrapper.position.copy(model.position);
    wrapper.rotation.copy(model.rotation);
    wrapper.scale.setScalar(currentScale * scaleFactor);

    scene.remove(model);
    scene.add(wrapper);
    model = wrapper;
  }, undefined, (err) => {
    console.error('joystick.glb failed to load, staying on placeholder', err);
  });

  function screenToScene(x, y) {
    return {
      x: x - window.innerWidth / 2,
      y: -(y - window.innerHeight / 2),
    };
  }

  function render() {
    renderer.render(scene, camera);
  }

  // ---- pinch detection + follow + drop ----
  // Three phases: 'idle' (hidden) -> 'growing' (quick pop-in right where
  // you pinch) -> 'following' (tracks your fingers every frame while
  // still pinched) -> 'dropped' (settles with a small bounce on release).
  const PINCH_ON_DIST = 0.045;
  const PINCH_OFF_DIST = 0.09;
  const TARGET_SCALE = 1.4;
  let pinching = false;
  let phase = 'idle';
  let t = 0;

  function applyScale(mult = 1) {
    const factor = model.userData.baseScale || 1;
    model.scale.setScalar(currentScale * factor * mult);
  }

  function onPinchStart(fx, fy) {
    if (phase === 'dropped') return; // one drop per take, use Reset for another
    const p = screenToScene(fx, fy);
    model.position.x = p.x;
    model.position.y = p.y;
    if (phase === 'idle') {
      phase = 'growing';
      t = 0;
    }
  }

  function onPinchRelease() {
    if (phase === 'growing' || phase === 'following') {
      phase = 'dropped';
      t = 0;
    }
  }

  function tickPopAnim() {
    if (phase === 'growing') {
      t += 0.09; // quick pop-in, ~150ms
      const p = Math.min(1, t);
      currentScale = THREE.MathUtils.lerp(0.0001, TARGET_SCALE, p);
      applyScale();
      model.rotation.y += 0.05;
      if (p >= 1) { currentScale = TARGET_SCALE; phase = 'following'; }
    } else if (phase === 'following') {
      currentScale = TARGET_SCALE;
      applyScale();
      model.rotation.y += 0.01; // gentle idle spin while it's being carried
    } else if (phase === 'dropped') {
      t += 0.06;
      const squash = Math.sin(Math.min(t, 1) * Math.PI) * Math.exp(-t * 2.5);
      currentScale = TARGET_SCALE;
      applyScale(1 + squash * 0.15); // small landing bounce, then settles flat
      model.rotation.y += 0.006 * Math.max(0, 1 - t);
    }
  }

  function resetAll() {
    phase = 'idle';
    t = 0;
    currentScale = 0.0001;
    applyScale();
  }
  resetBtn.addEventListener('click', resetAll);

  // ---- MediaPipe hand tracking ----
  let handLandmarker, running = false;

  async function start() {
    gate.classList.add('loading');
    gateText.textContent = 'Loading...';
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      camEl.srcObject = stream;
      await new Promise(r => camEl.onloadedmetadata = r);
      camEl.play();

      running = true;
      gate.classList.add('hidden');
      // give it a beat, then fade the debug chrome so the recording is clean
      setTimeout(() => chromeEl.classList.add('recording-clean'), 1500);
      loop();
    } catch (err) {
      gate.classList.remove('loading');
      gateText.textContent = 'Failed to start: ' + err.message;
    }
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function loop() {
    if (!running) return;
    const now = performance.now();
    const result = handLandmarker.detectForVideo(camEl, now);

    if (result.landmarks && result.landmarks.length > 0) {
      const lm = result.landmarks[0];
      const thumb = lm[4], index = lm[8];
      const d = dist(thumb, index);

      // rear camera is NOT mirrored, so map coordinates directly
      const fx = ((thumb.x + index.x) / 2) * window.innerWidth;
      const fy = ((thumb.y + index.y) / 2) * window.innerHeight;

      if (!pinching && d < PINCH_ON_DIST) {
        pinching = true;
        onPinchStart(fx, fy);
      } else if (pinching && d > PINCH_OFF_DIST) {
        pinching = false;
        onPinchRelease();
      } else if (pinching) {
        onPinchStart(fx, fy);
      }

      status.textContent = `pinch ${d.toFixed(3)} ${pinching ? 'PINCHING' : ''}`;
    } else {
      status.textContent = 'no hand';
    }

    tickPopAnim();
    render();
    requestAnimationFrame(loop);
  }

  gateBtn.addEventListener('click', () => { if (!running) start(); });
</script>
</body>
</html>
